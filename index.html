<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Feronia Wildlife Facility Management System - Dedicated portals for Administrators, Veterinarians, and Keepers." />
    <meta property="og:title" content="Feronia Wildlife Facility Management System" />
    <meta property="og:description" content="Feronia Wildlife Facility Management System - Dedicated portals for Administrators, Veterinarians, and Keepers." />
    <title>Feronia Wildlife Facility Management System</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('feronia_dark_mode');
          var isDark = saved !== null ? saved === 'true' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      html.dark, html.dark body {
        background-color: #04140D;
        color: #e2e8f0;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #F6F4EE;
        color: #1a251e;
      }
      #root {
        min-height: 100vh;
        width: 100%;
      }
      @keyframes feronia-spin { to { transform: rotate(360deg); } }
      @keyframes feronia-progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root">
      <div id="initial-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05160E;color:#e2e8f0;font-family:sans-serif;padding:24px;text-align:center;">
        <div style="width:68px;height:68px;border-radius:20px;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <svg style="width:36px;height:36px;color:#34d399;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>
          </svg>
        </div>
        <h1 style="margin:0 0 4px;font-size:24px;font-weight:900;color:#ffffff;letter-spacing:-0.5px;">FERONIA</h1>
        <p style="margin:0 0 24px;font-size:11px;font-weight:700;color:#34d399;letter-spacing:1px;text-transform:uppercase;">Wildlife Facility Management System</p>
        <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#94a3b8;">
          <div style="width:16px;height:16px;border:2px solid #10b981;border-top-color:transparent;border-radius:50%;animation:feronia-spin 0.8s linear infinite;"></div>
          <span>Starting system portals...</span>
        </div>
        <div style="width:200px;height:4px;background:rgba(16,185,129,0.15);border-radius:9999px;overflow:hidden;margin-top:16px;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,transparent,#10b981,transparent);border-radius:9999px;animation:feronia-progress 1.5s ease-in-out infinite;"></div>
        </div>
        <div id="splash-helper" style="display:none;margin-top:16px;font-size:11px;color:#64748b;">
          <span>Taking longer than usual? </span>
          <a href="#" onclick="window.location.reload();return false;" style="color:#34d399;text-decoration:underline;cursor:pointer;">Click to refresh</a>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var h = document.getElementById('splash-helper');
        if (h && document.getElementById('initial-splash')) {
          h.style.display = 'block';
        }
      }, 15000);
    </script>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Feronia Initialization Error:', e);
        var splash = document.getElementById('initial-splash');
        if (splash) {
          splash.innerHTML = '<div style="max-width:480px;background:#071F11;border:1px solid rgba(239,68,68,0.5);border-radius:16px;padding:24px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<div style="font-size:32px;margin-bottom:8px;">⚠️</div>' +
            '<h2 style="color:#fff;font-size:18px;margin:0 0 8px;font-weight:bold;">Interface Pause Detected</h2>' +
            '<p style="color:#cbd5e1;font-size:12px;margin:0 0 16px;word-break:break-word;">' + (e.message || 'Rendering paused during script bootstrap.') + '</p>' +
            '<div style="display:flex;gap:8px;justify-content:center;">' +
              '<button onclick="window.location.reload();" style="background:#059669;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px;">Reload Page</button>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="background:#1e293b;color:#cbd5e1;border:1px solid #334155;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px;">Clear Cache & Reload</button>' +
            '</div>' +
          '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('Feronia Unhandled Rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
